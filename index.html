<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="KidTracker — manage your children's extracurricular classes, track attendance, streaks, costs and progress — all in one place." />
    <meta name="theme-color" content="#6366f1" />
    <title>KidTracker — Kids Class Tracker</title>
    <!-- Prevent FOUC for dark mode -->
    <script>
      (function() {
        try {
          const s = localStorage.getItem('kids-class-tracker-store');
          if (s) {
            const data = JSON.parse(s);
            const theme = data?.state?.theme;
            if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
